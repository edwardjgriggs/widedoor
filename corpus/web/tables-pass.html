<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Price list</title>
  </head>
  <body>
    <main>
      <h1>Price list</h1>
      <table>
        <tr>
          <th id="item">Item</th>
          <th id="price">Price</th>
        </tr>
        <tr>
          <td headers="item">Coffee</td>
          <td headers="price">3 dollars</td>
        </tr>
      </table>
    </main>
  </body>
</html>
