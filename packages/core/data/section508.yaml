# Revised Section 508 Standards (36 CFR part 1194, Appendix A and C), as published by the
# U.S. Access Board. Ids and titles are copied from https://www.access-board.gov/ict/
# (checked 2026-10-21). Exception text is verbatim.
#
# kind:
#   section      a numbered section heading that groups provisions (302, 502, ...)
#   scoping      a provision that only says which other provisions apply (x.1 General, 502.2)
#   requirement  a provision with its own requirement
# incorporatesWcag20: the provision requires WCAG 2.0 Level A and AA Success Criteria and
#   Conformance Requirements (incorporated by reference, see 702.10.1).
# manual: a requirement no automated rule in Widedoor decides. scope is "product" for
#   Chapter 3 and Chapter 6 (they judge the product or its support, not one asset) and
#   "web" for Chapter 5 (software; a PDF is not software). Every Chapter 5 item carries a
#   condition (with the provision it comes from) stating when it applies to a web asset:
#   501.1 for 502 and 503, 504.1 for 504, or the platform addressee named in 502.2.1, 502.3
#   and 502.4. A reviewer marks the item not applicable, citing that provision, when the
#   condition does not hold.

meta:
  sources:
    - https://www.access-board.gov/ict/
  retrieved: 2026-10-21
  standard: Revised 508 Standards (2017), 36 CFR part 1194

provisions:
  - id: E205
    title: Electronic Content
    kind: section
  - id: E205.4
    title: Accessibility Standard
    kind: requirement
    incorporatesWcag20: true
    exceptions:
      - appliesTo: non-web-document
        criteria: ['2.4.1', '2.4.5', '3.2.3', '3.2.4']
        text: >-
          Non-Web documents shall not be required to conform to the following four WCAG 2.0
          Success Criteria: 2.4.1 Bypass Blocks, 2.4.5 Multiple Ways, 3.2.3 Consistent
          Navigation, and 3.2.4 Consistent Identification.
    note: >-
      E205.4.1 substitutes "document" for "Web page" and "page" when WCAG 2.0 is applied to
      non-Web documents.
  - id: E207.2
    title: WCAG Conformance
    kind: requirement
    incorporatesWcag20: true
    exceptions:
      - appliesTo: assistive-technology-software
        text: >-
          Software that is assistive technology and that supports the accessibility services of
          the platform shall not be required to conform to E207.2.
      - appliesTo: non-web-software
        criteria: ['2.4.1', '2.4.5', '3.2.3', '3.2.4']
        text: >-
          Non-Web software shall not be required to conform to the following four Success
          Criteria in WCAG 2.0: 2.4.1 Bypass Blocks; 2.4.5 Multiple Ways; 3.2.3 Consistent
          Navigation; and 3.2.4 Consistent Identification.
      - appliesTo: non-web-software
        conformanceRequirement: 3
        text: >-
          Non-Web software shall not be required to conform to Conformance Requirement 3
          Complete Processes in WCAG 2.0.
    note: >-
      Software scoping only; Widedoor does not test software. E207.3 replaces Conformance
      Requirement 3 for non-Web software, and E207.2.1 substitutes "software" for "Web page".

