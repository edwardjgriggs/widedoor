  - id: '501'
    title: General
    kind: section
  - id: '501.1'
    title: Scope
    kind: scoping
    exceptions:
      - appliesTo: web-application-without-platform-services
        provisions: ['502', '503']
        text: >-
          Where Web applications do not have access to platform accessibility services and do
          not include components that have access to platform accessibility services, they shall
          not be required to conform to 502 or 503 provided that they conform to Level A and Level
          AA Success Criteria and Conformance Requirements in WCAG 2.0 (incorporated by reference,
          see 702.10.1).

  - id: '502'
    title: Interoperability with Assistive Technology
    kind: section
  - id: '502.1'
    title: General
    kind: scoping
  - id: '502.2'
    title: Documented Accessibility Features
    kind: scoping
  - id: '502.2.1'
    title: User Control of Accessibility Features
    kind: requirement
    manual:
      scope: web
      condition:
        provision: '502.2.1'
        text: >-
          Applies only to platform software, the addressee of 502.2.1. A web application is not platform software.
  - id: '502.2.2'
    title: No Disruption of Accessibility Features
    kind: requirement
    manual:
      scope: web
      condition:
        provision: '501.1'
        text: >-
          Applies only if the web application has access to platform accessibility services or includes components that do. Otherwise 501.1 exempts it from 502 and 503, provided it conforms to WCAG 2.0 Level A and AA.
