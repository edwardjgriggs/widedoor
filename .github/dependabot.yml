version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    # A TypeScript major needs its own migration (7.0 failed CI), not a weekly bump.
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  # The composite action in packages/action pins its own actions.
  - package-ecosystem: github-actions
    directories:
      - /
      - /packages/action
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # Base images in the Dockerfile, pinned by tag and digest. verapdf/cli moves
  # only by hand, together with VERAPDF_IMAGE_REF and verapdf-map.yaml.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: verapdf/cli
      # Node follows the supported LTS line (24); veraPDF runs on a JDK 11 base.
      - dependency-name: node
        update-types: ['version-update:semver-major']
      - dependency-name: eclipse-temurin
        update-types: ['version-update:semver-major']
