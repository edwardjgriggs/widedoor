version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # The composite action in packages/action pins its own actions.
  - package-ecosystem: github-actions
    directories:
      - /
      - /packages/action
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # Base images in the Dockerfile, pinned by tag and digest. verapdf/cli moves
  # only by hand, together with VERAPDF_IMAGE_REF and verapdf-map.yaml.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: verapdf/cli
